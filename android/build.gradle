group 'io.customer.customer_io'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // SPIKE: Compose compiler Gradle plugin (Kotlin 2.x bundles it under the kotlin version).
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // WIP (visual-inbox-wrappers): the native `messaging-inbox` module is unreleased, so the inbox
        // components are consumed from the snapshot customerio-android CI publishes for its base feature
        // branch on every push (see `cioVersion` below). Remove on native release.
        maven {
            url = uri("https://central.sonatype.com/repository/maven-snapshots/")
            mavenContent { snapshotsOnly() }
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
// SPIKE (spike/visual-inbox-wrappers): Compose is required to host the native Visual Notification
// Inbox Compose components (NotificationInboxOverlay/Bell/View) inside Flutter platform views.
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def cioLocationEnabled = rootProject.findProperty("customerio_location_enabled")?.toBoolean() ?: false

android {
    namespace 'io.customer.customer_io'
    compileSdkVersion 36

    buildFeatures {
        buildConfig true
        // SPIKE: required to host the native inbox Compose components.
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
        buildConfigField "boolean", "CIO_LOCATION_ENABLED", "$cioLocationEnabled"
        consumerProguardFiles 'consumer-rules.pro'
    }

    // instruct kotlin compiler to opt in to the APIs annotated with the kotlin.RequiresOptIn
    // and io.customer.base.internal.InternalCustomerIOApi annotations
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
        kotlinOptions {
            freeCompilerArgs += ['-Xopt-in=kotlin.RequiresOptIn',
                                 '-Xopt-in=io.customer.base.internal.InternalCustomerIOApi',]
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    // Customer.io SDK
    // WIP (visual-inbox-wrappers): the native `messaging-inbox` module is unreleased, so consume the
    // snapshot customerio-android CI publishes for its base feature branch on every push to that PR
    // (`snapshot-release.yml` names it after the branch). Unlike mavenLocal this resolves on CI and on
    // any machine, so no local native build is needed.
    // On native release, revert to a version pin (e.g. "4.18.2") and drop the snapshot repo above.
    def cioVersion = "feat-overlay-inbox-SNAPSHOT"
    implementation "io.customer.android:datapipelines:$cioVersion"
    implementation "io.customer.android:messaging-push-fcm:$cioVersion"
    implementation "io.customer.android:messaging-in-app:$cioVersion"
    // Visual Notification Inbox UI components (NotificationInboxOverlay/Bell/View).
    implementation "io.customer.android:messaging-inbox:$cioVersion"

    // SPIKE: Compose runtime needed to host the native inbox Compose components.
    def composeBom = platform("androidx.compose:compose-bom:2025.10.00")
    implementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.runtime:runtime"
    implementation "androidx.activity:activity-compose:1.9.3"
    // Location module is optional - customers enable it by adding
    // customerio_location_enabled=true in their gradle.properties
    if (cioLocationEnabled) {
        implementation "io.customer.android:location:$cioVersion"
    } else {
        compileOnly "io.customer.android:location:$cioVersion"
    }
    
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:3.2.0'
}
