name: Lint

on: [pull_request]

# Cancel jobs and just run the last one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Xcode 27 Flutter sample pins
      run: apps/scripts/verify_xcode27_flutter_version.sh
    - uses: ./.github/actions/setup-flutter
    - name: Run flutter analyze
      run: flutter analyze
    - name: Run dart analyze as deployment process also runs it
      run: dart analyze
    - name: Analyze lifecycle fixture in its own package context
      working-directory: apps/lifecycle_fixture/dart
      run: |
        flutter pub get
        flutter analyze
