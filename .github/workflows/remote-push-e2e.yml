name: Flutter remote push E2E

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-remote-push-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remote-push:
    name: FCM delivery and opened attribution
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' &&
      github.event.label.name == 'run-remote-push-e2e' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Check out Flutter SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Xcode 27 toolchain
        uses: customerio/mobile-ci-tools/github-actions/ios/report-toolchain/v1@main
        with:
          expected-xcode-major: '27'
          expected-ios-sdk-major: '27'

      - name: Read pinned Flutter version
        id: flutter-pin
        shell: bash
        run: echo "version=$(<apps/flutter_sample_spm/.flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true

      - name: Install pinned Maestro
        shell: bash
        run: |
          set -euo pipefail
          maestro_zip="$RUNNER_TEMP/maestro-2.8.0.zip"
          maestro_dir="$RUNNER_TEMP/maestro-2.8.0"
          curl -fsSL \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.8.0/maestro.zip \
            -o "$maestro_zip"
          echo 'b3e561161904fb391875ca5834d5b22cf0b01c052dd1b408ad83e30d8f8951b3  '"$maestro_zip" \
            | shasum -a 256 -c -
          unzip -q "$maestro_zip" -d "$maestro_dir"
          echo "$maestro_dir/maestro/bin" >> "$GITHUB_PATH"

      - name: Run remote push E2E
        shell: bash
        env:
          CIO_E2E_ARTIFACT_DIR: ${{ runner.temp }}/flutter-remote-push-e2e
          MAESTRO_APP_API_KEY: ${{ secrets.MOBILE_E2E_FLUTTER_APP_API_KEY }}
          FLUTTER_CDP_API_KEY: ${{ secrets.MOBILE_E2E_FLUTTER_CDP_API_KEY }}
        run: apps/flutter_sample_spm/.maestro/run_remote_push.sh

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-remote-push-e2e
          path: ${{ runner.temp }}/flutter-remote-push-e2e
          if-no-files-found: warn
          retention-days: 14
