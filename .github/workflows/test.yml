name: Test

on: [pull_request]

# Cancel jobs and just run the last one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-flutter
    - name: Run Flutter tests
      run: flutter test
    - name: Run lifecycle fixture tests in their own package context
      working-directory: apps/lifecycle_fixture/dart
      run: |
        flutter pub get
        flutter test

  lifecycle_fixture_contract:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run lifecycle contract and capture-tool tests
      run: |
        validator_venv="$(mktemp -d)"
        python3 -m venv "$validator_venv"
        "$validator_venv/bin/pip" install 'jsonschema[format]>=4.18,<5'
        PYTHONDONTWRITEBYTECODE=1 "$validator_venv/bin/python" -m unittest \
          docs/dev-notes/test_validate_ios27_lifecycle_trace.py \
          apps/lifecycle_fixture/test_instrument_lifecycle_fixture_dependency.py \
          apps/lifecycle_fixture/test_lifecycle_fixture_build_lock.py \
          apps/lifecycle_fixture/test_run_flutter_lifecycle_capture.py
        "$validator_venv/bin/python" scripts/ios27_lifecycle_contract.py verify --root .
  
  test_publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-flutter

    - name: dry-run publishing to feel confident deployment will work after merging PR
      uses: k-paxian/dart-package-publisher@e555d5c07a728bca4c6706ff8907a76ab53a5bf0 # master
      with:
        credentialJson: ${{ secrets.CREDENTIAL_JSON }}
        dryRunOnly: true
        flutter: true
