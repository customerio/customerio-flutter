name: iOS toolchain compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/ios-toolchain-compatibility.yml'
      - 'apps/flutter_sample_cocoapods/**'
      - 'apps/flutter_sample_spm/**'
      - 'apps/scripts/**'
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile:
    name: ${{ matrix.toolchain }} (${{ matrix.manager }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: Xcode 26.6
            runner: macos-26
            xcode-version: '26.6'
            xcode-major: '26'
            ios-sdk-major: '26'
            experimental: false
            app: flutter_sample_spm
            manager: SwiftPM
          - toolchain: Xcode 26.6
            runner: macos-26
            xcode-version: '26.6'
            xcode-major: '26'
            ios-sdk-major: '26'
            experimental: false
            app: flutter_sample_cocoapods
            manager: CocoaPods
          - toolchain: Xcode 27 preview
            runner: xcode-27
            # Empty makes the setup action leave the image-bundled Xcode selected;
            # the next step fails closed unless it is Xcode/iOS SDK 27.
            xcode-version: ''
            xcode-major: '27'
            ios-sdk-major: '27'
            experimental: true
            app: flutter_sample_spm
            manager: SwiftPM
          - toolchain: Xcode 27 preview
            runner: xcode-27
            # Empty makes the setup action leave the image-bundled Xcode selected;
            # the next step fails closed unless it is Xcode/iOS SDK 27.
            xcode-version: ''
            xcode-major: '27'
            ios-sdk-major: '27'
            experimental: true
            app: flutter_sample_cocoapods
            manager: CocoaPods

    steps:
      - name: Check out Flutter SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Flutter inspects the selected Xcode when generating its SwiftPM plugin package.
      - name: Select Xcode
        id: select-xcode
        uses: customerio/mobile-ci-tools/github-actions/ios/setup-ios/v1@86901f620405b9acdcbee56020f3d4ef38e45650
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Report and verify toolchain family
        id: toolchain
        uses: customerio/mobile-ci-tools/github-actions/ios/report-toolchain/v1@39fdbfa85b60c110c5f40a979b27f7b2a8d54268
        with:
          expected-xcode-major: ${{ matrix.xcode-major }}
          expected-ios-sdk-major: ${{ matrix.ios-sdk-major }}

      - name: Verify and select canonical Flutter pin
        id: flutter-pin
        shell: bash
        run: |
          ./apps/scripts/verify_xcode27_flutter_version.sh
          echo "version=$(<"apps/${{ matrix.app }}/.flutter-version")" >> "$GITHUB_OUTPUT"

      - name: Install pinned Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true

      - name: Verify installed Flutter
        shell: bash
        run: ./apps/scripts/verify_xcode27_flutter_version.sh --installed

      - name: Install locked Ruby dependencies for CocoaPods
        if: matrix.manager == 'CocoaPods'
        uses: ruby/setup-ruby@922ebc4c5262cd14e07bb0e1db020984b6c064fe # v1.226.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: apps/${{ matrix.app }}

      - name: Prepare fixture
        shell: bash
        env:
          APP: ${{ matrix.app }}
          DEPENDENCY_MANAGER: ${{ matrix.manager }}
        run: |
          set -euo pipefail
          ./apps/scripts/setup_env.sh "apps/$APP"
          cd "apps/$APP"
          if [[ "$DEPENDENCY_MANAGER" == 'SwiftPM' ]]; then
            flutter config --enable-swift-package-manager
          fi
          flutter pub get
          if [[ "$DEPENDENCY_MANAGER" == 'CocoaPods' ]]; then
            bundle exec pod install --project-directory=ios
          fi

      - name: Compile Flutter fixture
        id: compile
        shell: bash
        working-directory: apps/${{ matrix.app }}
        env:
          DEPENDENCY_MANAGER: ${{ matrix.manager }}
        run: |
          set -o pipefail
          if [[ "$DEPENDENCY_MANAGER" == 'CocoaPods' ]]; then
            bundle exec flutter --verbose build ios --simulator --debug --no-pub 2>&1 | tee "$RUNNER_TEMP/${{ matrix.app }}-build.log"
          else
            flutter --verbose build ios --simulator --debug --no-pub 2>&1 | tee "$RUNNER_TEMP/${{ matrix.app }}-build.log"
          fi

      - name: Record compile result
        if: steps.compile.outcome == 'success'
        shell: bash
        env:
          APP: ${{ matrix.app }}
          DEPENDENCY_MANAGER: ${{ matrix.manager }}
          XCODE_VERSION: ${{ steps.toolchain.outputs.xcode-version }}
          XCODE_BUILD: ${{ steps.toolchain.outputs.xcode-build }}
          IOS_SIMULATOR_SDK: ${{ steps.toolchain.outputs.iphonesimulator-sdk }}
        run: |
          flutter_version="$(<"apps/$APP/.flutter-version")"
          {
            echo '## Flutter fixture compile'
            echo
            echo '**Classification:** compile-passed'
            echo "**Dependency manager:** $DEPENDENCY_MANAGER"
            echo "**Toolchain:** Flutter $flutter_version, Xcode $XCODE_VERSION build $XCODE_BUILD, iphonesimulator $IOS_SIMULATOR_SDK"
            echo '**Scope:** simulator compile only; no launch, lifecycle callback, push-delivery, signing, or App Store claim'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record compile failure
        if: failure() && steps.compile.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '## Flutter fixture compile'
            echo
            echo '**Classification:** sdk-compile-failed'
            echo '**Dependency manager:** ${{ matrix.manager }}'
            echo '**Toolchain family:** Xcode ${{ matrix.xcode-major }} / iOS SDK ${{ matrix.ios-sdk-major }}'
            echo '**Next step:** inspect the uploaded verbose build log for the exact compiler failure'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record setup failure
        if: failure() && steps.select-xcode.outcome != 'failure' && steps.toolchain.outcome != 'failure' && steps.compile.outcome != 'success' && steps.compile.outcome != 'failure'
        shell: bash
        run: |
          {
            echo '## Flutter fixture compile'
            echo
            echo '**Classification:** fixture-setup-failed'
            echo '**Dependency manager:** ${{ matrix.manager }}'
            echo '**Toolchain family:** Xcode ${{ matrix.xcode-major }} / iOS SDK ${{ matrix.ios-sdk-major }}'
            echo '**Next step:** inspect checkout, toolchain selection, dependency installation, and fixture preparation before attributing this to SDK compilation'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record unavailable toolchain
        if: failure() && (steps.select-xcode.outcome == 'failure' || steps.toolchain.outcome == 'failure')
        shell: bash
        run: |
          {
            echo '## Flutter fixture compile'
            echo
            echo '**Classification:** toolchain-unavailable'
            echo '**Dependency manager:** ${{ matrix.manager }}'
            echo '**Expected toolchain family:** Xcode ${{ matrix.xcode-major }} / iOS SDK ${{ matrix.ios-sdk-major }}'
            echo '**Next step:** inspect the toolchain report before evaluating fixture setup or SDK compilation'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-toolchain-${{ matrix.xcode-major }}-${{ matrix.app }}-build-log
          path: ${{ runner.temp }}/${{ matrix.app }}-build.log
          if-no-files-found: ignore
          retention-days: 7
