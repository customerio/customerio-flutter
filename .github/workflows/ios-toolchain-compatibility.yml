name: Xcode 27 preview compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/ios-toolchain-compatibility.yml'
  schedule:
    # Native runs one hour earlier; Expo runs one hour later.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Xcode 27 preview (${{ matrix.manager }})
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: flutter_sample_spm
            manager: SwiftPM
          - app: flutter_sample_cocoapods
            manager: CocoaPods

    steps:
      - name: Check out Flutter SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Flutter inspects the selected Xcode when generating its SwiftPM plugin package.
      - name: Report and verify toolchain family
        id: toolchain
        uses: customerio/mobile-ci-tools/github-actions/ios/report-toolchain/v1@main
        with:
          expected-xcode-major: '27'
          expected-ios-sdk-major: '27'

      - name: Verify and select canonical Flutter pin
        id: flutter-pin
        shell: bash
        run: |
          ./apps/scripts/verify_xcode27_flutter_version.sh
          echo "version=$(<"apps/${{ matrix.app }}/.flutter-version")" >> "$GITHUB_OUTPUT"

      - name: Install pinned Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true

      - name: Verify installed Flutter
        shell: bash
        run: ./apps/scripts/verify_xcode27_flutter_version.sh --installed

      - name: Install locked Ruby dependencies for CocoaPods
        if: matrix.manager == 'CocoaPods'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        env:
          BUNDLE_FROZEN: 'true'
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: apps/${{ matrix.app }}

      - name: Prepare fixture
        shell: bash
        env:
          APP: ${{ matrix.app }}
          DEPENDENCY_MANAGER: ${{ matrix.manager }}
        run: |
          set -euo pipefail
          ./apps/scripts/setup_env.sh "apps/$APP"
          cd "apps/$APP"
          if [[ "$DEPENDENCY_MANAGER" == 'SwiftPM' ]]; then
            flutter config --enable-swift-package-manager
          fi
          flutter pub get
          if [[ "$DEPENDENCY_MANAGER" == 'CocoaPods' ]]; then
            bundle exec pod install --project-directory=ios
          fi

      - name: Compile Flutter fixture
        id: compile
        shell: bash
        working-directory: apps/${{ matrix.app }}
        env:
          DEPENDENCY_MANAGER: ${{ matrix.manager }}
        run: |
          set -euo pipefail
          build_log="$RUNNER_TEMP/${{ matrix.app }}-build.log"
          if [[ "$DEPENDENCY_MANAGER" == 'CocoaPods' ]]; then
            bundle exec flutter --verbose build ios --simulator --debug --no-pub 2>&1 | tee "$build_log"
          else
            flutter --verbose build ios --simulator --debug --no-pub 2>&1 | tee "$build_log"
          fi
          build_arguments=(
            -scheme Runner
            -configuration Debug
            -destination 'generic/platform=iOS Simulator'
            -derivedDataPath "$RUNNER_TEMP/${{ matrix.app }}-scene-xcode-27"
            CIO_LIFECYCLE_INFOPLIST_SUFFIX=-Scene
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG CIO_SCENE_CONTRACT_SELF_TEST'
            CODE_SIGNING_ALLOWED=NO
            build
          )
          if [[ "$DEPENDENCY_MANAGER" == 'CocoaPods' ]]; then
            xcodebuild -workspace ios/Runner.xcworkspace "${build_arguments[@]}" 2>&1 | tee -a "$build_log"
          else
            xcodebuild -project ios/Runner.xcodeproj "${build_arguments[@]}" 2>&1 | tee -a "$build_log"
          fi

      - name: Confirm the AppDelegate-only control reproduces the Xcode 27 launch failure
        id: legacy-launch
        continue-on-error: true
        # TODO(MBL-2232): switch to @main after customerio/mobile-ci-tools#16 merges.
        uses: customerio/mobile-ci-tools/github-actions/ios/launch-simulator-app/v1@a5a10ee48b901234701ac38ff26daeb4b5d9c041
        with:
          app-path: apps/${{ matrix.app }}/build/ios/iphonesimulator/Runner.app
          expected-ios-major: '27'
          survival-seconds: '10'
          log-path: ${{ runner.temp }}/${{ matrix.app }}-legacy-launch.log

      - name: Verify the AppDelegate-only control failed for the UIScene requirement
        id: verify-legacy-control
        shell: bash
        env:
          LAUNCH_OUTCOME: ${{ steps.legacy-launch.outcome }}
          LAUNCH_LOG: ${{ runner.temp }}/${{ matrix.app }}-legacy-launch.log
        run: |
          set -euo pipefail
          test "$LAUNCH_OUTCOME" = 'failure'
          grep -Eq 'UIScene life cycle is required|_UIApplicationEvaluateRuntimeIssueForNoSceneLifecycleAdoption' "$LAUNCH_LOG"

      - name: Launch the UIScene fixture
        id: scene-launch
        # TODO(MBL-2232): switch to @main after customerio/mobile-ci-tools#16 merges.
        uses: customerio/mobile-ci-tools/github-actions/ios/launch-simulator-app/v1@a5a10ee48b901234701ac38ff26daeb4b5d9c041
        with:
          app-path: ${{ runner.temp }}/${{ matrix.app }}-scene-xcode-27/Build/Products/Debug-iphonesimulator/Runner.app
          expected-ios-major: '27'
          survival-seconds: '10'
          log-path: ${{ runner.temp }}/${{ matrix.app }}-scene-launch.log

      - name: Verify Flutter scene forwarding and source-level URL-handler contract
        id: verify-scene-contract
        shell: bash
        env:
          APP_PATH: ${{ runner.temp }}/${{ matrix.app }}-scene-xcode-27/Build/Products/Debug-iphonesimulator/Runner.app
          BUNDLE_ID: ${{ steps.scene-launch.outputs.bundle-id }}
          SIMULATOR_UDID: ${{ steps.scene-launch.outputs.simulator-udid }}
        run: |
          set -euo pipefail
          [[ "$SIMULATOR_UDID" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "$BUNDLE_ID" =~ ^[A-Za-z0-9.-]+$ ]]
          callback_log="$RUNNER_TEMP/${{ matrix.app }}-scene-callbacks.log"
          cleanup() {
            xcrun simctl terminate "$SIMULATOR_UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl uninstall "$SIMULATOR_UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          callback_start="$(date -v-5S +'%Y-%m-%d %H:%M:%S')"
          SIMCTL_CHILD_CIO_SCENE_HANDLER_SELF_TEST=1 \
            xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" "$BUNDLE_ID"
          for _ in {1..10}; do
            xcrun simctl spawn "$SIMULATOR_UDID" log show \
              --start "$callback_start" \
              --style compact \
              --predicate 'subsystem == "io.customer.flutter.fixture" AND category == "scene-lifecycle"' \
              > "$callback_log"
            if grep -Fq 'customerio-flutter-scene-will-connect' "$callback_log" \
              && grep -Fq 'customerio-flutter-scene-handler-contract-passed' "$callback_log"; then
              break
            fi
            sleep 1
          done
          grep -Fq 'customerio-flutter-scene-will-connect' "$callback_log"
          grep -Fq 'customerio-flutter-scene-handler-contract-passed' "$callback_log"
          test "$(grep -Fc 'customerio-flutter-scene-will-connect' "$callback_log")" -eq 1

      - name: Record launch result
        if: steps.scene-launch.outcome == 'success'
        shell: bash
        env:
          APP: ${{ matrix.app }}
          DEPENDENCY_MANAGER: ${{ matrix.manager }}
          FLUTTER_VERSION: ${{ steps.flutter-pin.outputs.version }}
          XCODE_VERSION: ${{ steps.toolchain.outputs.xcode-version }}
          XCODE_BUILD: ${{ steps.toolchain.outputs.xcode-build }}
          IOS_SIMULATOR_SDK: ${{ steps.toolchain.outputs.iphonesimulator-sdk }}
        run: |
          set -euo pipefail
          : "${FLUTTER_VERSION:?missing Flutter version output}"
          : "${XCODE_VERSION:?missing xcode-version output}"
          : "${XCODE_BUILD:?missing xcode-build output}"
          : "${IOS_SIMULATOR_SDK:?missing iphonesimulator-sdk output}"
          {
            echo '## Flutter fixture launch'
            echo
            echo '**Classification:** launch-passed'
            echo "**Dependency manager:** $DEPENDENCY_MANAGER"
            echo "**Toolchain:** Flutter $FLUTTER_VERSION, Xcode $XCODE_VERSION build $XCODE_BUILD, iphonesimulator $IOS_SIMULATOR_SDK"
            echo '**Host topologies:** AppDelegate-only compile plus expected Xcode 27 launch rejection; UIScene compile, launch survival, cold connection, and source-level URL-handler contract'
            echo '**Scope:** simulator compile, install, launch, 10-second process survival, Flutter scene callback forwarding, and an environment-gated URL classification self-test; no real URL stimulus or AppDelegate-to-engine delivery proof, push delivery, signing, or App Store claim'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record compile failure
        if: failure() && steps.compile.outcome == 'failure'
        shell: bash
        env:
          DEPENDENCY_MANAGER: ${{ matrix.manager }}
        run: |
          {
            echo '## Flutter fixture compile'
            echo
            echo '**Classification:** fixture-compile-failed'
            echo "**Dependency manager:** $DEPENDENCY_MANAGER"
            echo '**Toolchain family:** Xcode 27 / iOS SDK 27'
            echo '**Next step:** inspect the uploaded verbose build log for the exact compiler failure'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record launch failure
        if: failure() && steps.compile.outcome == 'success' && steps.scene-launch.outcome == 'failure'
        shell: bash
        env:
          DEPENDENCY_MANAGER: ${{ matrix.manager }}
        run: |
          {
            echo '## Flutter fixture launch'
            echo
            echo '**Classification:** scene-fixture-launch-failed'
            echo "**Dependency manager:** $DEPENDENCY_MANAGER"
            echo '**Toolchain family:** Xcode 27 / iOS SDK 27'
            echo '**Next step:** inspect the uploaded legacy and scene launch logs; the scene-enabled app did not survive the launch window'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record scene-contract verification failure
        if: failure() && steps.scene-launch.outcome == 'success' && steps.verify-scene-contract.outcome == 'failure'
        shell: bash
        env:
          DEPENDENCY_MANAGER: ${{ matrix.manager }}
        run: |
          {
            echo '## Flutter fixture scene contract'
            echo
            echo '**Classification:** scene-contract-verification-failed'
            echo "**Dependency manager:** $DEPENDENCY_MANAGER"
            echo '**Next step:** inspect the uploaded scene callback log; the app survived but did not prove Flutter scene forwarding or URL routing'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record invalid negative control
        if: failure() && steps.verify-legacy-control.outcome == 'failure'
        shell: bash
        env:
          DEPENDENCY_MANAGER: ${{ matrix.manager }}
        run: |
          {
            echo '## Flutter AppDelegate-only control'
            echo
            echo '**Classification:** legacy-negative-control-invalid'
            echo "**Dependency manager:** $DEPENDENCY_MANAGER"
            echo '**Expected result:** the AppDelegate-only app must fail with the Xcode 27 UIScene runtime signature'
            echo '**Next step:** inspect the uploaded legacy launch log before trusting the scene-fixture result'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record setup failure
        if: failure() && steps.toolchain.outcome != 'failure' && steps.compile.outcome != 'success' && steps.compile.outcome != 'failure'
        shell: bash
        env:
          DEPENDENCY_MANAGER: ${{ matrix.manager }}
        run: |
          {
            echo '## Flutter fixture compile'
            echo
            echo '**Classification:** fixture-setup-failed'
            echo "**Dependency manager:** $DEPENDENCY_MANAGER"
            echo '**Toolchain family:** Xcode 27 / iOS SDK 27'
            echo '**Next step:** inspect checkout, toolchain selection, dependency installation, and fixture preparation before attributing this to SDK compilation'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record unavailable toolchain
        if: failure() && steps.toolchain.outcome == 'failure'
        shell: bash
        env:
          DEPENDENCY_MANAGER: ${{ matrix.manager }}
        run: |
          {
            echo '## Flutter fixture compile'
            echo
            echo '**Classification:** toolchain-unavailable'
            echo "**Dependency manager:** $DEPENDENCY_MANAGER"
            echo '**Expected toolchain family:** Xcode 27 / iOS SDK 27'
            echo '**Next step:** inspect the toolchain report before evaluating fixture setup or SDK compilation'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcode-27-preview-${{ matrix.app }}-build-log
          path: ${{ runner.temp }}/${{ matrix.app }}-*.log
          if-no-files-found: ignore
          retention-days: 7
