name: Deploy Flutter SDK

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  deploy-git-tag:
    name: Deploy git tag
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic-release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - name: 'Generate token'
        id: generate_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.CIO_APP_CLIENT_ID }}
          private-key: ${{ secrets.CIO_APP_SECRET }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.generate_token.outputs.token }}

      # sd replaces strings in files. This downloads the pre-built binary (`cargo install` is slow), pinned with a
      # checksum so a new sd release cannot change deployments. 1.1.0 is what kenji-miyake/setup-sd installed ("latest").
      # If using sd on macos, "brew install" works great.
      - name: Install sd CLI to use later in the workflow
        env:
          SD_VERSION: 1.1.0
          SD_SHA256: 3613eca74cd686739bb5a6d68319aa56c747e7315274d02323a2ca2b1c5d82d2
        run: |
          archive="sd-v${SD_VERSION}-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/chmln/sd/releases/download/v${SD_VERSION}/$archive.tar.gz"
          echo "$SD_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$archive/sd" --version
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"

      - uses: ./.github/actions/setup-flutter
        with:
          install-sample-dependencies: 'false'

      # Run the same validation pub.dev enforces at publish time *before* the tag is created.
      # `dart-package-publisher` fails on any dry-run warning, and it only runs after the tag
      # exists, so a warning used to leave behind a tag for a version that was never published.
      - name: Validate package can be published
        run: flutter pub publish --dry-run

      - name: Deploy git tag via semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        id: semantic-release
        with:
          # Keep semantic-release and its changelog preset on a compatible writer version.
          semantic_version: 25.0.9
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.3.1
            @semantic-release/github
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Notify team of git tag creation
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: steps.semantic-release.outputs.new_release_published == 'true'
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # v2+ only warns on delivery failures by default; keep failing the step as v1 did.
          errors: true
          payload: |
            {
              "text": "Flutter SDK git tag created",
              "username": "Flutter deployment bot",
              "icon_url": "https://img.icons8.com/color/512/flutter.png",
              "channel": "#mobile-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Flutter* SDK git tag created successfully! (deployment step 1 of 2)"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Version ${{ steps.semantic-release.outputs.new_release_version }}*\n\nFlutter SDK deployment progress:\n ~1. <https://github.com/${{github.repository}}/releases/tag/${{steps.semantic-release.outputs.new_release_version}}|create git tag>~\n2. deploy to pub.dev\n\n"
                  }
                }
              ]
            }

      - name: Notify team of failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: ${{ failure() }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # v2+ only warns on delivery failures by default; keep failing the step as v1 did.
          errors: true
          payload: |
            {
              "text": "Flutter SDK deployment failure",
              "username": "Flutter deployment bot",
              "icon_url": "https://img.icons8.com/color/512/flutter.png",
              "channel": "#mobile-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Flutter* SDK deployment :warning: failure :warning:"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Flutter SDK failed deployment during step *validate package & create git tag*. View <https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}|CI server logs> to learn why and fix the issue. <https://github.com/customerio/mobile/blob/main/GIT-WORKFLOW.md|Learn more about the deployment process and how to fix errors>."
                  }
                }
              ]
            }

  deploy-to-pub-dev:
    name: Deploy to pub.dev
    needs: [deploy-git-tag]
    if: needs.deploy-git-tag.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy-git-tag.outputs.new_release_version }}

      - uses: ./.github/actions/setup-flutter

      - name: Publish to pub.dev
        uses: k-paxian/dart-package-publisher@e555d5c07a728bca4c6706ff8907a76ab53a5bf0 # master
        with:
          credentialJson: ${{ secrets.CREDENTIAL_JSON }}
          flutter: true

      - name: Notify team of successful deployment
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: ${{ success() }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # v2+ only warns on delivery failures by default; keep failing the step as v1 did.
          errors: true
          payload: |
            {
              "text": "Flutter SDK deployed to pub.dev",
              "username": "Flutter deployment bot",
              "icon_url": "https://img.icons8.com/color/512/flutter.png",
              "channel": "#mobile-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Flutter* SDK deployed to pub.dev! (deployment step 2 of 2)"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Version ${{ needs.deploy-git-tag.outputs.new_release_version }}*\n\nFlutter SDK deployment progress:\n ~1. <https://github.com/${{github.repository}}/releases/tag/${{ needs.deploy-git-tag.outputs.new_release_version }}|create git tag>~\n~2. deploy to pub.dev~\n\n"
                  }
                }
              ]
            }

      - name: Notify team of failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: ${{ failure() }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # v2+ only warns on delivery failures by default; keep failing the step as v1 did.
          errors: true
          payload: |
            {
              "text": "Flutter SDK deployment failure",
              "username": "Flutter deployment bot",
              "icon_url": "https://img.icons8.com/color/512/flutter.png",
              "channel": "#mobile-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Flutter* SDK deployment :warning: failure :warning:"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Flutter SDK failed deployment during step *deploy to pub.dev*. View <https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}|CI server logs> to learn why and fix the issue. <https://github.com/customerio/mobile/blob/main/GIT-WORKFLOW.md|Learn more about the deployment process and how to fix errors>."
                  }
                }
              ]
            }

  publish-sample-apps-public-builds:
    needs: [deploy-git-tag, deploy-to-pub-dev]
    uses: ./.github/workflows/build-sample-app-for-sdk-release.yml
    with:
      sdk_version: ${{ needs.deploy-git-tag.outputs.new_release_version }}
    secrets: inherit
