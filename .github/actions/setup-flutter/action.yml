name: Setup
description: Setup runner to be able to build an app with Flutter. Not specific for Android or iOS.

inputs:
  flutter-version:
    description: Exact Flutter version. Leave empty to install the latest stable release.
    required: false
    default: ''
  install-sample-dependencies:
    description: Whether to resolve dependencies for every sample app.
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
  - name: Install latest stable Flutter
    if: inputs.flutter-version == ''
    uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
    with:
      channel: stable

  - name: Install exact stable Flutter
    if: inputs.flutter-version != ''
    uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
    with:
      channel: stable
      flutter-version: ${{ inputs.flutter-version }}

  - run: flutter --version
    shell: bash

  - run: flutter clean
    shell: bash

  - name: Install Flutter dependencies
    run: flutter pub get
    shell: bash

  - name: Install Flutter dependencies for sample apps
    if: inputs.install-sample-dependencies == 'true'
    run: |
      for app_dir in apps/flutter_sample_*/; do
        echo "Installing dependencies for $app_dir"
        cd "$app_dir"
        touch .env
        flutter pub get
        cd -
      done
    shell: bash
