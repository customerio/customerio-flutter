name: Setup sd
description: Install the sd CLI (used by scripts/update-version.sh) from a checksum-verified release binary. Linux x86_64 only.

runs:
  using: "composite"
  steps:
  - name: Install sd v1.1.0
    shell: bash
    run: |
      set -euo pipefail
      sd_archive="$RUNNER_TEMP/sd-v1.1.0.tar.gz"
      curl -fsSL \
        https://github.com/chmln/sd/releases/download/v1.1.0/sd-v1.1.0-x86_64-unknown-linux-musl.tar.gz \
        -o "$sd_archive"
      echo '02f00f4777d43e8e95b7b8d49e1a0d6e502fed4b8e79c1c8b8063857a30caa2e  '"$sd_archive" \
        | sha256sum -c -
      tar -xzf "$sd_archive" -C "$RUNNER_TEMP"
      echo "$RUNNER_TEMP/sd-v1.1.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
