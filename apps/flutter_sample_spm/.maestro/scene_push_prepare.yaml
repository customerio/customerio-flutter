appId: io.customer.testbed.flutter.spm
name: Flutter UIScene push routing, prepare
---
- launchApp:
    clearState: false
    permissions:
      location: never
      notifications: unset
- assertVisible: "First Name Input"
- tapOn: "First Name Input"
- inputText: "Maestro Scene Tester"
- tapOn: "Email Input"
- inputText: "maestro+flutter-scene@cio.test"
- tapOn: "Login Button"
- extendedWaitUntil:
    visible: "Custom Event Button"
    timeout: 10000
- scrollUntilVisible:
    element: "Show Push Prompt Button"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn: "Show Push Prompt Button"
- extendedWaitUntil:
    visible: "^(Allow|Push notifications are enabled on this device)$"
    timeout: 15000
- runFlow:
    when:
      visible: "^Allow$"
    commands:
      - tapOn: "^Allow$"
      - extendedWaitUntil:
          visible: "Show Push Prompt Button"
          timeout: 10000
      - tapOn: "Show Push Prompt Button"
- extendedWaitUntil:
    visible: "Push notifications are enabled on this device"
    timeout: 15000
- assertVisible: "Push Permission"
