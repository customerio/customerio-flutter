org.gradle.jvmargs=-Xmx4g
android.useAndroidX=true
# Jetifier is deliberately off. It only rewrites legacy com.android.support artifacts, none of
# which this app pulls in, and it fails outright on dependencies compiled with newer bytecode:
# it could not transform byte-buddy ("Unsupported class file major version 68") on the
# url_launcher_android test classpath. See https://issuetracker.google.com/issues/184622491
customerio_location_enabled=true
customerio_geofence_enabled=true
customerio_live_activities_enabled=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
